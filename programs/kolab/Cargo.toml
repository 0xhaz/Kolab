[package]
name = "kolab"
version = "0.1.0"
description = "Kolab escrow: campaigns, slots, auto-release"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "kolab"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Enables Config.demo_offset + set_demo_offset. Local-demo builds only, never the hosted program.
demo-clock = []


[dependencies]
anchor-lang = { version = "1.2.1", default-features = false, features = ["solana-v4", "init-if-needed"] }
anchor-spl = { version = "1.2.1", default-features = false, features = ["solana-v4", "token", "token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "0.18.0"
litesvm-token = "0.18.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
